<script>
/* СТРАХОВКА ОТ ОБРЫВА ЗАГРУЗКИ: основной скрипт приложения находится в конце файла.
   Если антивирус/VPN/сеть оборвёт соединение раньше времени, кнопки «мрут» молча.
   Этот маленький блок в начале файла проверяет: приложение инициализировалось?
   Если нет — показывает понятное сообщение, что делать. */
window.__egeReady = false;
window.addEventListener('load', function() {
  setTimeout(function() {
    if (window.__egeReady) return;
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;background:rgba(255,255,255,0.97);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,Arial,sans-serif;color:#111';
    d.innerHTML = '<div style="font-size:44px;margin-bottom:12px">⚠️</div>' +
      '<div style="font-size:18px;font-weight:700;margin-bottom:8px">Страница загрузилась не полностью</div>' +
      '<div style="font-size:14px;color:#666;max-width:440px;line-height:1.7;margin-bottom:18px">Соединение оборвалось до конца загрузки файла.<br>Частая причина — антивирус с проверкой защищённых соединений (Kaspersky, Avast, ESET, Dr.Web) или VPN.<br><br>1) Обновите страницу: Ctrl+Shift+R<br>2) Если не помогло — приостановите защиту антивируса / отключите VPN<br>3) Или откройте сайт через мобильный интернет</div>' +
      '<button onclick="location.reload()" style="padding:12px 26px;font-size:15px;font-weight:600;border:none;border-radius:12px;background:#111;color:#fff;cursor:pointer">Обновить страницу</button>';
    document.body.appendChild(d);
  }, 2500);
});
</script>
